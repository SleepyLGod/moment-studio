name: Publish interactive demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:samples
      - run: npm run build:demo
        env:
          DEMO_BASE: /moment-studio/
      - name: Stage public demo files
        run: |
          mkdir -p pages/{assets,photos,styles,fonts,legal}
          cp dist-demo/index.html pages/
          cp dist-demo/assets/*.js dist-demo/assets/*.css pages/assets/
          cp dist-demo/photos/{*.jpg,fjord-demo.png,credits.json} pages/photos/
          cp dist-demo/styles/*.png pages/styles/
          cp dist-demo/fonts/{SleetMono-Regular.ttf,SleetMono-LICENSE.txt} pages/fonts/
          cp dist-demo/legal/*.txt pages/legal/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
